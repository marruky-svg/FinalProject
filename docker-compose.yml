services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    # A construção paralela do índice HNSW usa memória partilhada; o Docker dá 64 MB por omissão.
    shm_size: 1gb
    ports:
    - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    
volumes:
  pgdata:
